name: llmvet
summary: Local code-review tool for LLM/agent harnesses
description: |
  llmvet is a local code-review tool for LLM/agent harnesses. An agent
  invokes it after making changes; a human reviews the diff in a browser,
  leaves inline comments, and either submits the review (returning comments
  as a prompt for the agent) or approves without changes.
adopt-info: llmvet
base: core24
license: Apache-2.0

grade: stable
confinement: strict

apps:
  llmvet:
    command: bin/llmvet
    plugs:
      - desktop
      - network
      - network-bind
      - home

parts:
  llmvet:
    plugin: nil
    source: .
    build-snaps:
      - go
      - node/22/stable
    build-packages:
      - git
      - make
    stage-packages:
      - git
    override-build: |
      base_version="$(sed -n 's/^var Version = "\(.*\)"/\1/p' "${SNAPCRAFT_PART_SRC}/cmd/llmvet/main.go")"
      commit_index="$(git rev-list --count HEAD)"
      short_hash="$(git rev-parse --short HEAD)"
      version="${base_version}-${commit_index}-g${short_hash}"
      craftctl set version="${version}"
      make build LDFLAGS="-X main.Version=${version}"
      make extensions
      install -D -m755 bin/llmvet "${SNAPCRAFT_PART_INSTALL}/bin/llmvet"
      mkdir -p "${SNAPCRAFT_PART_INSTALL}/share/agent-skills"
      cp -r share/agent-skills/llmvet "${SNAPCRAFT_PART_INSTALL}/share/agent-skills/"
      mkdir -p "${SNAPCRAFT_PART_INSTALL}/share/extensions"
      cp -r share/dist/extensions/oh-my-pi/llmvet "${SNAPCRAFT_PART_INSTALL}/share/extensions/oh-my-pi-llmvet"
      cp -r share/dist/extensions/pi/llmvet "${SNAPCRAFT_PART_INSTALL}/share/extensions/pi-llmvet"
